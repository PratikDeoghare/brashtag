/* =========================
   BRASHTAG PARSER (same as before, simplified)
========================= */

class Bag {
  constructor(tag, kids = []) {
    this.tag = tag;
    this.kids = kids;
  }

  addKids(...kids) {
    this.kids.push(...kids);
  }

  setTag(tag) {
    this.tag = tag;
  }

  string() {
    return `#${this.tag}{${this.kids.map(k => k.string()).join("")}}`;
  }
}

class Code {
  constructor(tag, text) {
    this.tag = tag;
    this.text = text;
  }

  setTag(tag) {
    this.tag = tag;
  }

  setText(text) {
    this.text = text;
  }

  string() {
    return `${this.tag}${this.text}${this.tag}`;
  }
}

class Blob {
  constructor(text) {
    this.text = text;
  }

  setText(text) {
    this.text = text;
  }

  string() {
    return this.text;
  }
}

function parse(text) {

  const result = parseBag(text);

  if (result.error) {
    throw new Error(result.error);
  }

  if (result.rest.length !== 0) {
    throw new Error(
      "unexpected trailing input: " +
      result.rest.slice(0, 100)
    );
  }

  return result.node;
}

function parseBag(text) {

  const root = new Bag("");

  let c = 0;
  let bagOpen = false;

  while (c < text.length) {

    if (text[c] !== "{") {
      c++;
    } else {
      bagOpen = true;
      break;
    }
  }

  if (!bagOpen) {
    return {
      error: "unopened bag missing { after #",
      rest: text
    };
  }

  root.setTag(text.slice(1, c));

  text = text.slice(c + 1);

  while (text.length > 0) {

    if (text[0] === "#") {

      const result = parseBag(text);

      if (result.error) return result;

      root.addKids(result.node);

      text = result.rest;

      continue;
    }

    if (text[0] === "`") {

      const result = parseCode(text);

      if (result.error) return result;

      root.addKids(result.node);

      text = result.rest;

      continue;
    }

    if (text[0] === "}") {

      return {
        node: root,
        rest: text.slice(1)
      };
    }

    const result = parseBlob(text);

    if (result.error) return result;

    root.addKids(result.node);

    text = result.rest;
  }

  return {
    error: "bag not closed",
    rest: text
  };
}

function parseCode(text) {

  const root = new Code("", "");

  let c = 0;

  while (c < text.length && text[c] === "`") {
    c++;
  }

  root.setTag(text.slice(0, c));

  let j = c;

  while (j < text.length - c + 1) {

    if (text.slice(j, j + c) !== root.tag) {
      j++;
    } else {

      root.setText(text.slice(c, j));

      return {
        node: root,
        rest: text.slice(j + c)
      };
    }
  }

  return {
    error: "code not closed",
    rest: text
  };
}

function parseBlob(text) {

  const root = new Blob("");

  let j = 0;

  while (j < text.length) {

    switch (text[j]) {

      case "`":
      case "#":
      case "}":

        root.setText(text.slice(0, j));

        return {
          node: root,
          rest: text.slice(j)
        };

      case "{":

        return {
          error: "unexpected {"
        };

      default:
        j++;
    }
  }

  root.setText(text.slice(0, j));

  return {
    node: root,
    rest: text.slice(j)
  };
}

/* =========================
   HTML CONVERSION
========================= */

function compileRenderer() {
  const code = rendererEditor.getValue();

  return new Function(
    "Bag",
    "Code",
    "Blob",
    code + "; return nodeToHtml;"
  )(Bag, Code, Blob);
}

function toHtml(text) {
  const tree = parse(text);
  const fn = compileRenderer();
  return fn(tree);
}

/* =========================
   AST
========================= */

function serialize(n) {
  if (n instanceof Bag) {
    return { type: "Bag", tag: n.tag, kids: n.kids.map(serialize) };
  }
  if (n instanceof Code) {
    return { type: "Code", tag: n.tag, text: n.text };
  }
  if (n instanceof Blob) {
    return { type: "Blob", text: n.text };
  }
}

function toCyGraph(ast) {

  const elements = [];
  let id = 0;

  function walk(node, parent = null) {

    const myId = String(id++);

    let label = "";
    let type = "";

    if (node instanceof Bag) {
      label = "#" + showWhitespace(node.tag);
      type = "bag";
    }

    else if (node instanceof Code) {
      label = showWhitespace(node.text);
      type = "code";
    }

    else if (node instanceof Blob) {
      label = showWhitespace(node.text) ;
      type = "blob";
    }

    elements.push({
      data: {
        id: myId,
        label,
        type
      }
    });

    if (parent !== null) {

      elements.push({
        data: {
          id: parent + "-" + myId,
          source: parent,
          target: myId
        }
      });
    }

    if (node instanceof Bag) {
      for (const k of node.kids) {
        walk(k, myId);
      }
    }
  }

  walk(ast);

  return elements;
}

let cyInstance = null;

function showWhitespace(s) {
  return s
    .replaceAll(" ", "␣")
    .replaceAll("\t", "⇥\t")
    .replaceAll("\n", "↵\n");
}

function escapeHtml(str) {

  return str
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}
